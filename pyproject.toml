[project]
name = "noether"
version = "0.1.0"
description = "Proves a pull request did not silently change behaviour it did not mean to change."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["httpx>=0.27", "jsonschema>=4", "python-dotenv>=1", "contree-sdk>=0.3.6"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
noether = "noether.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls Token Factory or Nebius Sandboxes (set NOETHER_LIVE=1)"]
